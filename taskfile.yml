# Use Task to define tasks and run them locally or in CI
# For more information about Task, see https://taskfile.dev/#/usage?id=usage
version: '3'

# Variables used by the build (see go:build)
vars:
  # Module path, used to inject the version into modules/config
  GO_MODULE:
    sh: go list -m
  # Last tag, followed by the commit and +dirty when the tree is not a clean tagged commit
  VERSION:
    sh: git describe --tags --always --dirty
  # Date of the commit, not of the build: two builds of the same commit give the same binary
  BUILD_DATE:
    sh: git log -1 --format=%cI
  # Folder of the built binary
  BUILD_FOLDER: build

# Import tasks from other files
includes:
  go: ./.task/go.taskfile.yml
  go-tools: ./.task/go-tools.taskfile.yml

# Define tasks
tasks:
  info:
    desc: "Display information about the project."
    cmds:
      - echo "version is ({{.VERSION}})"
      - echo "build date is ({{.BUILD_DATE}})"
    silent: true
